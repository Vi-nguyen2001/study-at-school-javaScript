<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Document</title>
</head>

<body>
    <header class="header" id="header">
        <div>
            <img src="../image/logo.png" alt="" />
        </div>
        <h2>Nguyễn Văn Vĩ-PH63869</h2>
        <div>
            <nav class="menu">
                <ul>
                    <li>Trình chiếu</li>
                    <li>Bán hàng</li>
                    <li>Đăng ký</li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section1">

            <img id="anh" src="../image/0.jpg" class="d-block w-100">
            <div class="btn">
                <button class="btn1" onclick="nextSlide()">Next</button>
                <button class="btn1" onclick="startSlide()">Start</button>
                <button class="btn1" onclick="stopSlide()">Stop</button>
                <button class="btn1" onclick="prevSlide()">Prev</button>
            </div>




        </section>
        <section class="section2">
            <div class="container">
                <div class="card-header">
                    <h2>Bán hàng</h2>
                    <span class="refresh-icon">🔄</span>
                </div>

                <div class="card-filter">
                    <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
                        <option selected>Chọn mức giá</option>
                        <option value="1">50</option>
                        <option value="2">100</option>
                        <option value="3">200</option>
                        <option value="4">300</option>
                        <option value="5">400</option>
                        <option value="6">500</option>
                        <option value="7">700</option>
                        <option value="8">800</option>
                    </select>

                </div>

                <div class="card-body">
                    <table class="sales-table">

                        <thead>
                            <tr>
                                <th><input type="checkbox" id="check-all"></th>
                                <th>Hàng hóa</th>
                                <th>Đơn giá</th>
                                <th>Số lượng</th>
                                <th>Thành tiền</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Iphone 9</td>
                                <td>800</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Sumsung</td>
                                <td>200</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Nokia 9</td>
                                <td>400</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Sony Xperia</td>
                                <td>100</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Motorola</td>
                                <td>300</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Oppo</td>
                                <td>700</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Bphone</td>
                                <td>50</td>
                                <td></td>
                                <td>0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Huawei</td>
                                <td>500</td>
                                <td></td>
                                <td>0</td>
                            </tr>


                        </tbody>

                        <tfoot>
                            <tr>
                                <td colspan="4">Tổng</td>
                                <td id="tong">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </section>
        <section class="section3">
            <form class="container2">
                <div class="row1 g-3">
                    <div class="col-md-5">
                        <label for="inputFullName" class="form-label">Nhập tên</label>
                        <input type="text" class="form-control" id="inputFullName" required>
                    </div>
                    <div class="col-md-5">
                        <label for="inputEmail4" class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail4" required>
                    </div>
                </div>

                <div class="row2">
                    <fieldset class="col-md-5">
                        <legend class="col-form-label col-sm-2 pt-0">Giới tính</legend>
                        <div class="col-sm-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1"
                                    value="option1" checked>
                                <label class="form-check-label" for="gridRadios1">
                                    Nam
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2"
                                    value="option2">
                                <label class="form-check-label" for="gridRadios2">
                                    Nữ
                                </label>
                            </div>

                        </div>
                    </fieldset>

                    <div class="col-md-5">
                        <label for="inputAge" class="form-label">Nhập Tuổi</label>
                        <input type="password" class="form-control" id="inputAge" required>
                    </div>


                </div>

                <div class="row3 g-3">
                    <div class="col-md-5">
                        <label for="inputCountry" class="form-label">Quốc gia</label>
                        <input type="password" class="form-control" id="inputCountry" required>
                    </div>
                    <div class="col-md-5">
                        <label for="inputInterest" class="form-label">Sở thích</label>
                        <input type="email" class="form-control" id="inputInterest" required>
                    </div>
                </div>

                <div class="row4" style="padding: 20px;">
                    <div>Nội dung</div>
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"
                            style="height: 100px" required></textarea>
                        <label for="floatingTextarea2">Nội dung</label>
                    </div>
                </div>


                <div class="row5">
                    <button class="btn1">Đăng ký</button>
                </div>



            </form>


        </section>
    </main>
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var imgArr = new Array();

        for (var i = 0; i <= 6; i++) {
            imgArr[i] = new Image();
            imgArr[i].src = "../image/" + i + ".jpg";
        }

        var index = 0;
        function nextSlide() {
            if (index < 6) {
                index++;
                document.getElementById("anh").src = imgArr[index].src;
            } else {
                index = 0;
                document.getElementById("anh").src = imgArr[index].src;
            }
        }

        function prevSlide() {
            if (index > 0) {
                index--;
                document.getElementById("anh").src = imgArr[index].src;
            } else {
                index = 6;
                document.getElementById("anh").src = imgArr[index].src;
            }
        }

        function startSlide() {
            autoSlide = setInterval(nextSlide, 1000);
        }

        function stopSlide() {
            clearInterval(autoSlide);
        }





    </script>
</body>

</html>
