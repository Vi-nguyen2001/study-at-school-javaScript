                                <td>

                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Nokia 9</td>
                                <td class="price">400</td>
                                <td>
                                    <input type="number" class="qty" min="1" value="1" disabled>
                                </td>
                                <td class="amount">0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Sony Xperia</td>

                                <td>
                                    <input type="number" class="qty" min="1" value="1" disabled>
                                </td>

                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Motorola</td>
                                <td class="price">300</td>
                                <td>
                                    <input type="number" class="qty" min="1" value="1" disabled>
                                </td>
                                <td class="amount">0</td>
                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Oppo</td>
                                <td class="price">700</td>
                                <td>
                                    <input type="number" class="qty" min="1" value="1" disabled>
                                </td>

                            </tr>

                            <tr>
                                <td><input type="checkbox" class="check-item"></td>
                                <td>Bphone</td>

                                </td>

        </section>
        <section class="section3" id="dangky">
            <form class="container2" action="dangky.html" onsubmit="return kiemtra()">
                <div class="row1 g-3">
                    <div class="col-md-5">
                        <label for="inputFullName" class="form-label">Nhập tên</label>
                        <input type="text" class="form-control" id="inputFullName">

                    </div>
                    <div class="col-md-5">
                        <label for="inputEmail4" class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail4">

                    </div>
                </div>

                <div class="row2">

                    </div>
                    <div class="col-md-5">
                        <label for="inputInterest" class="form-label">Sở thích</label>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        //js phần section1
        var imgArr = new Array();

        for (var i = 0; i <= 6; i++) {
            imgArr[i] = new Image();
            imgArr[i].src = "../image/" + i + ".jpg";
        }

        var index = 0;
        function nextSlide() {
            if (index < 6) {
                index++;
                document.getElementById("anh").src = imgArr[index].src;
            } else {
                index = 0;
                document.getElementById("anh").src = imgArr[index].src;
            }
        }

        function prevSlide() {
            if (index > 0) {
                index--;
                document.getElementById("anh").src = imgArr[index].src;
            } else {
                index = 6;
                document.getElementById("anh").src = imgArr[index].src;
            }
        }

        function startSlide() {
            autoSlide = setInterval(nextSlide, 1000);
        }

        function stopSlide() {
            clearInterval(autoSlide);
        }




        //js phần section2

        let checkItem = document.querySelectorAll(".check-item");
        checkItem.forEach(function (item) {

            item.addEventListener("change", function () {

                let row = this.parentElement.parentElement;//lấy dòng tr vừa được click

                let price = Number(
                    row.querySelector(".price").innerText
                );

                let qtyInput = row.querySelector(".qty");

                let amountCell = row.querySelector(".amount");

                if (this.checked) {

                    qtyInput.disabled = false;

                    amountCell.innerText = price * qtyInput.value;

                } else {

                    qtyInput.disabled = true;

                    amountCell.innerText = 0;

                }

                tinhTong();
            });

        });

        function tinhTong() {
            let tong = 0;
            let amount = document.querySelectorAll(".amount");
            amount.forEach(function (item) {
                tong += Number(item.innerText);
            });
            document.getElementById("tong").innerText = tong;
        }

        let qtys = document.querySelectorAll(".qty");

        qtys.forEach(function (qty) {

            qty.addEventListener("input", function () {

                let row = this.parentElement.parentElement;

                let price = Number(
                    row.querySelector(".price").innerText
                );

                row.querySelector(".amount").innerText =
                    price * this.value;

                tinhTong();
            });

        });

        function refreshTable() {
            location.reload();
        }


        let selectGia = document.getElementById("floatingSelect");
        selectGia.addEventListener("change", function () {
            let giaChon = this.options[this.selectedIndex].text;
            let row = document.querySelectorAll("tbody tr");

            row.forEach(function (row) {
                let giaSanPham = row.querySelector(".price").innerText;
                if (giaChon === "Chọn mức giá") {
                    row.style.display = "table-row";
                } else if (giaChon === giaSanPham) {
                    row.style.display = "table-row";
                } else {
                    row.style.display = "none";
                }
            })
        });


        let checkAll = document.getElementById("check-all");
        checkAll.addEventListener("change", function () {
            let checkItem = document.querySelectorAll(".check-item");
            checkItem.forEach(function (item) {
                item.checked = checkAll.checked;
                item.dispatchEvent(new Event("change"));
            });
        });


        //js phần section3



        var hoten = document.getElementById("inputFullName");
        var email = document.getElementById("inputEmail4");
        var tuoi = document.getElementById("inputAge");
        var quocgia = document.getElementById("inputCountry");
        var sothich = document.getElementById("inputInterest")

        function kiemtra() {
            if (hoten.value == '') {
                document.getElementById('kiemloiten').innerHTML = 'họ tên không được để trống';
                return false;
            } else {
                document.getElementById('kiemloiten').innerHTML = '';
            }

            var filter = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
            if (!filter.test(email.value)) {
                document.getElementById('kiemloiEmail').innerHTML = 'Email chưa hợp lệ';
                return false;
            } else {
                document.getElementById('kiemloiEmail').innerHTML = '';
            }

            if (tuoi.value == '' || isNaN(tuoi.value) || tuoi.value < 0) {
                document.getElementById('kiemloituoi').innerHTML = 'Tuổi phải là số';
                return false;
            } else {
                document.getElementById('kiemloituoi').innerHTML = '';
            }

            if (quocgia.value == '') {
                document.getElementById('kiemloiquocgia').innerHTML = 'Vui lòng điền Quốc Gia';
                return false;
            } else {
                document.getElementById('kiemloiquocgia').innerHTML = '';
            }

            if (sothich.value == '') {
                document.getElementById('kiemloiSothich').innerHTML = 'Vui lòng điền Sở Thích';
                return false;
            } else {
                document.getElementById('kiemloiSothich').innerHTML = '';
            }

            return true;
        }

        //js body

        const universe = document.getElementById("universe");

        let stars = [];

        for (let i = 0; i < 300; i++) {

            let star = document.createElement("div");

            star.classList.add("star");

            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;

            star.style.left = x + "px";
            star.style.top = y + "px";

            universe.appendChild(star);

            stars.push({
                element: star,
                x: x,
                y: y
            });
        }

        document.addEventListener("mousemove", function (e) {

            stars.forEach(function (star) {

                let dx = e.clientX - star.x;
                let dy = e.clientY - star.y;

                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {

                    star.element.style.transform =
                        "scale(3)";

                    star.element.style.boxShadow =
                        "0 0 20px white";

                } else {

                    star.element.style.transform =
                        "scale(1)";

                    star.element.style.boxShadow =
                        "none";
                }

            });

        });
    </script>
</body>


</html>
