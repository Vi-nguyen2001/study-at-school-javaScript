<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outPut{
            width:500px;
            height: 500px;
            border: 1px solid black;
            margin: 0 auto;
            text-align: center;
        }

        .box{
            width: 50px;
            height: 50px;
           position: relative;
           top: 50px;
           left: 20%;
           background-color: red;
        }

        .message{
            text-align: center;
            padding: 10px;
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="outPut"></div>
    <div class="message"></div>

    <script>
        const output = document.querySelector(".outPut");
        const message = document.querySelector(".message");

        message.textContent = "Click vào box";
        const box = document.createElement("div");
        const game = {
            timer: 0,
            start: null
        };
        box.classList.add("box");
        output.append(box);

        function ranNum(max){
            return Math.floor(Math.random() * max);
        }

        function addBox(){
            game.start = new Date().getTime();
            message.textContent = "Click vào box";
            box.style.display = "block";
            box.style.top = ranNum(450) + "px";
            box.style.left = ranNum(450) + "px";
        }

        box.addEventListener("click", () => {
            box.textContent = "";
            box.style.display = "none";
            game.timer = setTimeout(addBox, ranNum(3000));
            if(!game.start ){
               message.textContent = "Loading ...."
            }else{
                const cur = new Date().getTime();
                const dur = (cur - game.start) / 1000;
                message.textContent = `It took ${dur} seconds to click!`;
            }
            
        });
        addBox();
    </script>
</body>
</html>
