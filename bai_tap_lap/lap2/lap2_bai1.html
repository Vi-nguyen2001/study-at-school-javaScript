<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <script>
        
        var a = prompt('Nhập vào cạnh a của tam giác');
        var b = prompt('Nhập vào cạnh b của tam giác');
        var c = Math.sqrt(Math.pow(a,2)+Math.pow(b,2)).toFixed(2);
        alert('Cạnh huyền của tam giác là: ' + c);
        document.write('Cạnh huyền của tam giác là: ' + c);

    </script>

</body>

</html>
