<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var m = prompt('Nhập số m vuông cần đổi ')
        var sao = (m/360).toFixed(2);
        var ha = (m/3600).toFixed(2);
        var mau = Number(ha).toFixed(2);
        alert(m + ' m vuông bằng ' + sao + ' sào, ' + ha + ' héc ta, ' + mau + ' mẫu');
        document.write(m + ' m vuông bằng ' + sao + ' sào, ' + ha + ' héc ta, ' + mau + ' mẫu');
    </script>
</body>
</html>
