<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label id="pro" data-price="1950">iphone9</label>
    <input id ="qty" type="number" min="0"/>
    <button onclick="tinhTien()" >OK</button>
    <hr/>
    <h3>Name: <span id="name"></span></h3>
    <h3>Amonut: <span id="amount">?</span></h3>
    

    <script>
       function tinhTien(){
        let pro = document.getElementById("pro");
        let qty = document.getElementById("qty");
        var name = pro.innerText;
        var price = pro.getAttribute("data-price");
        var amount = price * qty.value;
        document.getElementById("name").innerText = name;
        document.getElementById("amount").innerText = amount;
       }
    </script>
</body>
</html>
